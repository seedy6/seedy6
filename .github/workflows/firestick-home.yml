name: Fire Stick home screen APK

on:
  push:
    paths:
      - "firestick-home/**"
      - ".github/workflows/firestick-home.yml"
  workflow_dispatch:

permissions:
  contents: write # to publish the APK on the firestick-home-latest release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firestick-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk welcome-home.apk

      - uses: actions/upload-artifact@v4
        with:
          name: welcome-home-apk
          path: firestick-home/welcome-home.apk

      # A fixed link the Fire Stick's Downloader app can fetch:
      # https://github.com/seedy6/seedy6/releases/download/firestick-home-latest/welcome-home.apk
      - name: Publish to the firestick-home-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firestick-home-latest
          name: Fire Stick home screen (latest build)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Latest build of Welcome Home from `${{ github.ref_name }}` (${{ github.sha }}).
            On the Fire Stick, open Downloader and enter:
            https://github.com/seedy6/seedy6/releases/download/firestick-home-latest/welcome-home.apk
          files: firestick-home/welcome-home.apk
